name: Release

# Triggered when you push a tag like v1.0.0
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ── Build Windows EXE ─────────────────────────────────
  build-agent-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc_agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller pc_connector.spec --noconfirm --clean

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC_Connector_Agent_exe
          path: pc_agent/dist/PC_Connector_Agent.exe

  # ── Build Android APK (Capacitor) ─────────────────────
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate web build and sync Capacitor
        env:
          NUXT_PUBLIC_BACKEND_BASE: ${{ secrets.MOBILE_BACKEND_BASE }}
        run: npm run cap:sync

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: web_app/android

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release*.apk out/PC_Connector.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC_Connector_APK
          path: web_app/out/PC_Connector.apk

  # ── Build Desktop (Electron, Windows) ─────────────────
  build-desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web_app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build Nitro server bundle
        run: npm run build

      - name: Package with electron-builder
        run: npx electron-builder --win nsis --publish never

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC_Connector_Desktop
          path: web_app/release/*.exe

  # ── Create GitHub Release ─────────────────────────────
  release:
    needs: [build-agent-exe, build-apk, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: PC_Connector_Agent_exe
          path: dist/

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: PC_Connector_APK
          path: dist/

      - name: Download Desktop
        uses: actions/download-artifact@v4
        with:
          name: PC_Connector_Desktop
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "PC Connector ${{ github.ref_name }}"
          body: |
            ## PC Connector ${{ github.ref_name }}

            ### Downloads
            | Datei | Beschreibung |
            |-------|-------------|
            | `PC_Connector_Agent.exe` | PC-Server für Windows (kein Python nötig) |
            | `PC_Connector.apk` | Android App (Vue/Capacitor) |
            | `*.exe` (Setup) | Desktop-App für Windows (Electron) |

            ### Installation
            **PC-Server:** EXE starten, Weboberfläche unter `http://localhost:8420`  
            **Android:** APK auf dem Handy installieren (Einstellung „Aus unbekannten Quellen" aktivieren)  
            **Desktop:** Setup-EXE ausführen
          files: |
            dist/PC_Connector_Agent.exe
            dist/PC_Connector.apk
            dist/*.exe
          draft: false
          prerelease: false
