name: Release

# Triggered when you push a tag like v1.0.0
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ── Build Windows EXE ─────────────────────────────────
  build-agent-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc_agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller pc_connector.spec --noconfirm --clean

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC_Connector_Agent_exe
          path: pc_agent/dist/PC_Connector_Agent.exe

  # ── Build Android APK ─────────────────────────────────
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.x"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC_Connector_APKs
          path: mobile_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  # ── Create GitHub Release ─────────────────────────────
  release:
    needs: [build-agent-exe, build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: PC_Connector_Agent_exe
          path: dist/

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: PC_Connector_APKs
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "PC Connector ${{ github.ref_name }}"
          body: |
            ## PC Connector ${{ github.ref_name }}

            ### Downloads
            | Datei | Beschreibung |
            |-------|-------------|
            | `PC_Connector_Agent.exe` | PC-Server für Windows (kein Python nötig) |
            | `app-arm64-v8a-release.apk` | Android App (moderne Geräte, z.B. Pixel) |

            ### Installation
            **PC-Server:** EXE starten, Weboberfläche unter `http://localhost:8420`  
            **Android:** APK auf dem Handy installieren (Einstellung „Aus unbekannten Quellen" aktivieren)
          files: |
            dist/PC_Connector_Agent.exe
            dist/app-arm64-v8a-release.apk
          draft: false
          prerelease: false
